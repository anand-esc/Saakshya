<!DOCTYPE html>
<!--
  spatial-test.html — THROWAWAY test UI for Track A (Spatial Intelligence).

  Not part of the final submission. Just enough to sanity check the
  /hotspots and /bias-audit responses before the real frontend team wires
  this into the Slate-based client. No framework, no build step.

  Usage:
    1. Deploy spatial_hotspots and spatial_bias_audit as Catalyst
       Functions, note the base URL.
    2. Edit API_BASE below.
    3. Open this file directly in a browser (or serve it with any static
       server) — it just does fetch() calls.

  All data shown is synthetic seed data. Nothing here is validated
  against real crime statistics.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spatial Intelligence — Test UI (throwaway)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  body { font-family: monospace; margin: 0; padding: 12px; background: #111; color: #ddd; }
  h1 { font-size: 16px; }
  .synthetic-banner {
    background: #402; color: #fdd; padding: 6px 10px; font-size: 12px;
    border: 1px solid #a33; margin-bottom: 10px;
  }
  #controls { margin-bottom: 8px; }
  #controls input, #controls button { font-family: monospace; padding: 4px; }
  #map { height: 420px; width: 100%; border: 1px solid #444; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
  th, td { border: 1px solid #444; padding: 4px 8px; text-align: left; }
  th { background: #222; }
  .badge-green { color: #6f6; }
  .badge-amber { color: #fc6; }
  .badge-grey  { color: #999; }
</style>
</head>
<body>

<h1>Track A — Spatial Test UI (throwaway, not the real frontend)</h1>
<div class="synthetic-banner">
  All data below is SYNTHETIC seed data. No real incident, prediction, or
  bias figure has been validated against real-world crime statistics.
</div>

<div id="controls">
  API base: <input id="apiBase" value="http://localhost:3000" size="30" />
  district_id: <input id="districtId" value="KA-BLR-URB" size="16" />
  <button onclick="loadHotspots()">Load /hotspots</button>
  <button onclick="loadBiasAudit()">Load /bias-audit</button>
</div>

<div id="map"></div>

<h2>Raw /bias-audit response</h2>
<table id="biasTable">
  <thead><tr><th>district_id</th><th>fpr</th><th>n</th></tr></thead>
  <tbody></tbody>
</table>

<script>
const map = L.map('map').setView([15.5, 76.5], 6); // rough Karnataka center
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let cellLayer = L.layerGroup().addTo(map);

function badgeColor(badge) {
  if (badge === 'green') return '#2ecc71';
  if (badge === 'amber') return '#f39c12';
  return '#888'; // grey
}

async function loadHotspots() {
  const base = document.getElementById('apiBase').value;
  const districtId = document.getElementById('districtId').value;
  try {
    const res = await fetch(`${base}/hotspots?district_id=${encodeURIComponent(districtId)}`);
    const data = await res.json();
    cellLayer.clearLayers();
    (data.cells || []).forEach(cell => {
      const radius = 200 + cell.density * 800; // meters, just for visibility
      L.circle([cell.lat, cell.lng], {
        radius,
        color: badgeColor(cell.badge),
        fillColor: badgeColor(cell.badge),
        fillOpacity: 0.35,
        weight: 1,
      }).bindPopup(
        `lat: ${cell.lat}<br>lng: ${cell.lng}<br>density: ${cell.density}<br>badge: ${cell.badge}`
      ).addTo(cellLayer);
    });
    console.log(`Loaded ${data.cells ? data.cells.length : 0} cells for ${districtId}`);
  } catch (err) {
    alert('Failed to load /hotspots — check API base and console for details.');
    console.error(err);
  }
}

async function loadBiasAudit() {
  const base = document.getElementById('apiBase').value;
  try {
    const res = await fetch(`${base}/bias-audit`);
    const data = await res.json();
    const tbody = document.querySelector('#biasTable tbody');
    tbody.innerHTML = '';
    (data.districts || []).forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.district_id}</td><td>${row.fpr === null ? 'n/a' : row.fpr}</td><td>${row.n}</td>`;
      tbody.appendChild(tr);
    });
  } catch (err) {
    alert('Failed to load /bias-audit — check API base and console for details.');
    console.error(err);
  }
}
</script>

</body>
</html>
